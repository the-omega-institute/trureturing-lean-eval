name = "cw-solid-constructor"
version = "0.1.0"
defaultTargets = ["Constructor"]

[leanOptions]
autoImplicit = false
"Elab.async" = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "5e0c4e5239cb0a2d86d68a884bf52cfd963fce22"

[[lean_lib]]
name = "Constructor"
srcDir = "src"
roots = ["CWSolid.OriginalDerived"]

[[lean_lib]]
name = "ConstructorDependencies"
srcDir = "src"
roots = ["CWSolid", "CWComparison", "ChallengeDeps"]
globs = ["CWSolid.+", "CWComparison.+", "ChallengeDeps"]

[[lean_lib]]
name = "PartialBenchmark"
srcDir = "src"
roots = ["ChallengeIntegrated", "IntegratedTargetAudit"]
